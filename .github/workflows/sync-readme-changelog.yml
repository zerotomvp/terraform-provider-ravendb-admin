name: Sync README changelog

on:
  release:
    types: [published, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True, check=True).stdout

          def normalize_body(body: str) -> str:
              # Strip the leading "## Changelog" header that goreleaser wraps
              # each release body with.
              body = re.sub(r"^\s*##\s+Changelog\s*\n", "", body, count=1)
              # Demote any remaining headings by one level so they nest under
              # the per-release "### vX.Y.Z" heading we emit below.
              body = re.sub(r"^(#+)(?= )", r"#\1", body, flags=re.MULTILINE)
              return body.rstrip()

          tags = gh("release", "list", "--limit", "100", "--json", "tagName", "--jq", ".[].tagName").split()
          parts = []
          for tag in tags:
              body = gh("release", "view", tag, "--json", "body", "--jq", ".body")
              if body.strip():
                  parts.append(f"### {tag}\n\n{normalize_body(body)}\n")
              else:
                  parts.append(f"### {tag}\n\n_(no release notes)_\n")
          block = "\n".join(parts).rstrip() + "\n"

          readme = pathlib.Path("README.md")
          content = readme.read_text()
          new, n = re.subn(
              r"(<!-- changelog:start -->\n).*?(\n<!-- changelog:end -->)",
              lambda m: m.group(1) + block + m.group(2),
              content,
              count=1,
              flags=re.DOTALL,
          )
          if n == 0:
              raise SystemExit("changelog markers not found in README.md")
          readme.write_text(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "docs: sync README changelog from GitHub releases"
          git push
